# data
training_file: data/Amazon-131K/train.txt
test_file: data/Amazon-131K/test.txt
data_name: Amazon-131K
min_vocab_freq: 1
max_seq_length: 128
include_test_labels: true
remove_no_label_data: true
add_special_tokens: true
sparse: false

# train
seed: 777
epochs: 100
batch_size: 32
optimizer_encoder: adam
optimizer_classifier: sgd
learning_rate: 0
learning_rate_encoder: 0.0001
learning_rate_classifier: 0.05

momentum: 0.9
weight_decay_encoder: 0
weight_decay_classifier: 0.0001
shuffle: true
val_size: 0
precision: 32

# scheduler - COSINE WITH WARMUP
lr_scheduler: cosine_schedule_with_warmup
scheduler_config:
  warmup_steps: 5000

# model - MiniLM
model_name: SDistilBERT
loss_function: binary_cross_entropy_with_logits
init_weight: null
network_config:
  lm_weight: sentence-transformers/msmarco-distilbert-base-v4
  post_encoder_dropout: 0.75

# pretrained vocab / embeddings
vocab_file: null
embed_file: null
normalize_embed: false

# ensemble
ensemble: false
sample_rate: 0
