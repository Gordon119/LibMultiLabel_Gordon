# data
training_file: data/Wiki10-31K/train.txt
test_file: data/Wiki10-31K/test.txt
data_name: Wiki10-31K
min_vocab_freq: 1
max_seq_length: 512
include_test_labels: true
remove_no_label_data: true
add_special_tokens: true
sparse: false

# train
seed: 777
epochs: 50
batch_size: 64
optimizer: adamw
learning_rate: 0
learning_rate_encoder: ['grid_search', [0.00001, 0.00002, 0.00003, 0.00005, 0.00007, 0.0001]]
learning_rate_classifier: ['grid_search', [0.005, 0.006, 0.007, 0.008, 0.01, 0.05]]

momentum: 0
weight_decay: ['grid_search', [0, 0.01]]
patience: 5
early_stopping_metric: P@1
shuffle: true
val_size: 0.05
precision: 32

# scheduler - COSINE WITH WARMUP
# lr_scheduler: cosine_schedule_with_warmup
# scheduler_config:
#   warmup_step: 0.6
lr_scheduler: null
scheduler_config:
  warmup_ratio: 0

# eval
eval_batch_size: 256
monitor_metrics: ['P@1', 'P@3', 'P@5']
val_metric: P@1

# model - MiniLM
model_name: SBERT
loss_function: binary_cross_entropy_with_logits
init_weight: null
network_config:
  lm_weight: sentence-transformers/all-MiniLM-L12-v2
  dropout: ['grid_search', [0, 0.1]]
  lm_window: 512

# pretrained vocab / embeddings
vocab_file: null
embed_file: null
normalize_embed: false

# ensemble
ensemble: false
sample_rate: 0

# hyperparameter search
search_alg: basic_variant
num_samples: 1
scheduler: null

# other parameters
checkpoint_path: null
cpu: false
data_workers: 4
eval: false
label_file: null
limit_train_batches: 1.0
limit_val_batches: 1.0
limit_test_batches: 1.0
metric_threshold: 0.5
result_dir: runs
save_k_predictions: 0
silent: true
embed_cache_dir: null
